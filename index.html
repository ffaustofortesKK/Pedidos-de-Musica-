<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FF-KARAOKE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#f4eef1;font-family:"Segoe UI",Arial,sans-serif;min-height:100vh}
#bgl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22vw;font-weight:900;line-height:.9;color:#ff4f93;opacity:.14;pointer-events:none}#bgi{width:80vw;max-width:520px;height:auto}
main{position:relative;max-width:460px;margin:0 auto;padding:18px}
h1{color:#FFD400;text-align:center;font-size:24px;margin:8px 0 18px}h2{color:#ff4f93;margin:0 0 10px}
section{display:none;background:rgba(20,16,20,.88);border:1px solid #3a2430;border-radius:12px;padding:16px}
label{display:block;margin:10px 0 4px;font-size:14px}
input[type=text],input[type=tel]{width:100%;padding:12px;font-size:17px;border-radius:8px;border:1px solid #3a2430;background:#000;color:#fff}
button{width:100%;margin-top:12px;padding:13px;font-size:17px;font-weight:700;border:0;border-radius:8px;background:#ff4f93;color:#000}
button.s{background:#222;color:#fff;border:1px solid #3a2430}
.big{font-size:20px;font-weight:800;color:#FFD400;text-align:center;line-height:1.35}.msg{color:#ff4f93;font-weight:700;margin-bottom:10px}
.rd label{display:inline-block;margin-right:18px}

.fp{height:56px;vertical-align:middle;margin-left:10px;display:none}.frow{display:flex;align-items:center;margin-top:6px}
#ed{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:20;display:none;align-items:flex-start;justify-content:center;overflow:auto}
.edb{width:min(420px,100%);padding:14px;text-align:center}
#cv{width:240px;max-width:62vw;background:repeating-conic-gradient(#1c1c1c 0 25%,#262626 0 50%) 0 0/16px 16px;border-radius:10px;margin:8px auto;display:block}
.o{display:inline-flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:13px;padding:2px 8px;user-select:none}
.o i{width:14px;height:14px;border-radius:50%;border:2px solid #ff4f93;display:block}.o.on i{background:#FFD400;border-color:#FFD400;box-shadow:0 0 7px #FFD400}
.sl{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}.sl input{flex:1;accent-color:#ff4f93}
</style></head><body>
<div id="bgl"><img id="bgi" alt="" src="https://cdn.phototourl.com/anon/2026-11-17-bb01fa71-73b8-464f-b8df-5c3291c52e7b.jpg" onerror="this.style.display='none';document.getElementById('bgt').style.display='block'"><div id="bgt" style="display:none">FF<br>KARAOKE</div></div>
<main><h1 id="est">FF-KARAOKE</h1>
<section id="s0"><div class="big">Leia o QR code do estabelecimento para pedir a sua música.</div></section>
<section id="s1"><h2>Registo</h2>
<label>Nome</label><input type="text" id="nome" autocomplete="off">
<label>Telefone</label><input type="tel" id="tel" autocomplete="off">
<label>Foto (opcional)</label><div class="frow"><button type="button" class="s" id="bF1" style="width:auto;margin:0;padding:10px 16px">📷 Tirar foto</button><img id="fp1" class="fp" alt=""></div>
<button id="b1">Continuar</button></section>
<section id="s2"><h2 id="ola"></h2><div class="msg" id="aviso"></div>
<label>Música / cantor que quer cantar</label><input type="text" id="mus" autocomplete="off">
<label>Quer trocar a sua foto antes de enviar o pedido?</label>
<div class="rd"><label><input type="radio" name="tf" value="s"> Sim</label><label><input type="radio" name="tf" value="n" checked> Não</label></div>
<div id="fbox" style="display:none"><div class="frow"><button type="button" class="s" id="bF2" style="width:auto;margin:0;padding:10px 16px">📷 Tirar foto</button><img id="fp2" class="fp" alt=""></div></div>
<button id="b2">Enviar pedido</button><button class="s" id="b3">Sair do perfil</button><div style="font-size:11px;color:#8a7;margin-top:6px;text-align:center">Ao sair do perfil, a sua foto é retirada do ecrã.</div></section>
<section id="s3"><div class="big" id="st"></div><div class="big" id="pos"></div><div id="dbg" style="text-align:center;font-size:11px;color:#8a7;margin-top:8px"></div><button class="s" id="b4">Anular pedido</button></section>
</main>
<input type="file" id="fIn" accept="image/*" capture="user" style="display:none">
<div id="ed"><div class="edb"><h2>A sua foto</h2>
<div style="font-size:13px;color:#ddd;margin-bottom:4px">Círculo: só cabe a cabeça</div>
<canvas id="cv" width="240" height="240"></canvas>
<div class="sl">Zoom <input type="range" id="zm" min="100" max="300" value="100"></div>
<div class="sl">Mover ↔ <input type="range" id="px" min="-100" max="100" value="0"></div>
<div class="sl">Mover ↕ <input type="range" id="py" min="-100" max="100" value="0"></div>
<div style="font-size:12px;color:#aaa;margin:4px 0">Ajuste para a sua cabeça caber no círculo.</div>
<button id="edOk">Usar esta foto</button><button class="s" id="edNo">Cancelar</button></div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},P=new URLSearchParams(location.hash.slice(1)),C=P.get('c'),K=P.get('k'),B=(P.get('n')||'https://ntfy.sh').replace(/\/+$/,''),me={},foto='',es=null,PK={name:'ECDH',namedCurve:'P-256'};
$('est').textContent=P.get('e')||P.get('p')||'FF-KARAOKE';document.title=($('est').textContent)+' · Pedidos de música';
var SK='ffkc_'+C;
function getA(){try{return JSON.parse(sessionStorage.getItem(SK))}catch(e){return null}}
function setA(a){try{a?sessionStorage.setItem(SK,JSON.stringify(a)):sessionStorage.removeItem(SK)}catch(e){}}
function show(n){['s0','s1','s2','s3'].forEach(function(i){$(i).style.display=i===n?'block':'none'})}
function b64u(buf){var s='',a=new Uint8Array(buf),i;for(i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';var s=atob(t),a=new Uint8Array(s.length),i;for(i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function rnd(n){var a=new Uint8Array(n),s='',i,c='abcdefghijkmnpqrstuvwxyz23456789';crypto.getRandomValues(a);for(i=0;i<n;i++)s+=c[a[i]%c.length];return s}
function enc(o){
  var kp,ek;
  return crypto.subtle.generateKey(PK,true,['deriveKey']).then(function(k){kp=k;
    return Promise.all([crypto.subtle.exportKey('raw',k.publicKey),crypto.subtle.importKey('raw',unb64u(K),PK,false,[])])}).then(function(r){ek=b64u(r[0]);
    return crypto.subtle.deriveKey({name:'ECDH',public:r[1]},kp.privateKey,{name:'AES-GCM',length:256},false,['encrypt'])}).then(function(k){
    var iv=crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify(o))).then(function(c){return{ek:ek,iv:b64u(iv),ct:b64u(c)}})});
}
function send(t,m){return fetch(B+'/'+t,{method:'POST',body:JSON.stringify(m)}).then(function(r){if(!r.ok)throw new Error('o servidor recusou (HTTP '+r.status+')');return r.json().catch(function(){return{}})})}
function readFoto(f,cb){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var c=document.createElement('canvas');c.height=140;c.width=Math.max(1,Math.round(im.width*140/im.height));c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);cb(c.toDataURL('image/jpeg',.6))};im.src=u}
/* ---------- Editor de foto: circulo / boneca / boneco ---------- */
var pimg=null,psty='c',pcv=$('cv'),pcx=pcv.getContext('2d'),SK2=Math.PI*2;
function pdraw(){
  var W=240,H=psty==='c'?240:320,hx=120,hy=psty==='c'?120:98,hr=psty==='c'?116:70,x=pcx;
  pcv.height=H;x.clearRect(0,0,W,H);
  x.save();x.beginPath();x.arc(hx,hy,hr,0,SK2);x.clip();x.fillStyle='#333';x.fillRect(0,0,W,H);
  if(pimg){var s=Math.max(2*hr/pimg.width,2*hr/pimg.height)*($('zm').value/100),w=pimg.width*s,h=pimg.height*s;x.drawImage(pimg,hx-w/2+$('px').value*hr/100,hy-h/2+$('py').value*hr/100,w,h)}
  x.restore();x.lineWidth=5;x.strokeStyle='#fff';x.beginPath();x.arc(hx,hy,hr,0,SK2);x.stroke();
}
function pout(w,h,tipo,q){var o=document.createElement('canvas');o.width=w;o.height=h;o.getContext('2d').drawImage(pcv,0,0,pcv.width,pcv.height,0,0,w,h);return o.toDataURL(tipo,q)}
function pfinal(){
  var c=psty==='c',w=c?128:120,h=c?128:160,u=pout(w,h,'image/webp',.78);
  if(u.indexOf('image/webp')!==5)u=pout(Math.round(w*.8),Math.round(h*.8),'image/png');
  return u;
}
function pickFoto(){$('fIn').value='';$('fIn').click()}
$('bF1').onclick=$('bF2').onclick=pickFoto;
$('fIn').onchange=function(){
  var f=this.files[0];if(!f)return;var im=new Image(),u=URL.createObjectURL(f);
  im.onload=function(){pimg=im;URL.revokeObjectURL(u);$('zm').value=100;$('px').value=0;$('py').value=0;$('ed').style.display='flex';pdraw()};
  im.onerror=function(){alert('Não foi possível abrir esta imagem. Tente outra foto.')};im.src=u;
};
['zm','px','py'].forEach(function(i){$(i).oninput=pdraw});
$('edNo').onclick=function(){$('ed').style.display='none'};
$('edOk').onclick=function(){foto=pfinal();$('ed').style.display='none';['fp1','fp2'].forEach(function(i){$(i).src=foto;$(i).style.display='inline-block'})};

function render(){
  var a=getA();
  if(!a){show(me.nome?'s2':'s1');return}
  show('s3');
  if(a.st==='ok'){if(a.pos===0){$('st').textContent='É A SUA VEZ!';$('pos').textContent=''}else{$('st').textContent='PEDIDO CONFIRMADO';$('pos').innerHTML=a.pos>0?'A sua posição na fila: <b>'+(a.pos+1)+'º</b><br>Faltam <b>'+a.pos+'</b> '+(a.pos===1?'cantor':'cantores')+' antes de si':''}}
  else{$('st').textContent='O SEU PEDIDO FOI ENVIADO COM SUCESSO, MAS NEM TODAS AS MÚSICAS EXISTEM EM KARAOKE. AGUARDE PELA CONFIRMAÇÃO.';$('pos').textContent=''}
}
function aviso(t){$('aviso').textContent=t}
var rxl='all',sev={};
function sub(){
  var a=getA();if(!a)return;if(es)es.stop=true;var me2=es={stop:false};
  function got(d){if(!d||d.event!=='message'||sev[d.id])return;sev[d.id]=1;rxl=d.id;try{hand(JSON.parse(d.message))}catch(x){}}
  function open(){if(me2.stop||!window.EventSource)return;var x=new EventSource(B+'/'+a.r+'/sse?since='+encodeURIComponent(rxl));me2.x=x;x.addEventListener('message',function(e){try{got(JSON.parse(e.data))}catch(z){}});x.onerror=function(){try{x.close()}catch(z){}if(!me2.stop)setTimeout(open,3000)}}
  function poll(){if(me2.stop)return;fetch(B+'/'+a.r+'/json?poll=1&since='+encodeURIComponent(rxl)).then(function(r){return r.ok?r.text():''}).then(function(t){String(t).split('\n').forEach(function(l){if(l.trim())try{got(JSON.parse(l))}catch(z){}})}).catch(function(){}).then(function(){if(!me2.stop)setTimeout(poll,8000)})}
  open();setTimeout(poll,2500);
}
function hand(m){
  var a=getA();if(!a)return;
  if(m.t==='ok'){a.st='ok';setA(a)}
  else if(m.t==='pos'){var was=a.pos;a.pos=m.n;a.st='ok';setA(a);if(m.n===0&&was!==0&&navigator.vibrate)navigator.vibrate([300,150,300,150,500])}
  else if(m.t==='no'){setA(null);aviso('O seu pedido não foi aceite (essa música pode não existir em karaoke). Pode pedir outra música.')}
  else if(m.t==='dup'){setA(null);aviso('Já existe um pedido ativo para este telefone.')}
  else if(m.t==='done'){setA(null);aviso('Obrigado por cantar! Pode fazer um novo pedido.')}
  render();
}
$('b1').onclick=function(){
  var n=$('nome').value.trim(),t=$('tel').value.replace(/\D/g,'');
  if(!n||t.length<9)return alert('Escreva o seu nome e um telefone válido.');
  me={nome:n,tel:t};$('ola').textContent='Olá, '+n;
  
  aviso('');render();
};
document.querySelectorAll('[name=tf]').forEach(function(r){r.onchange=function(){$('fbox').style.display=this.value==='s'?'block':'none'}});
$('b3').onclick=function(){var rs=me.rs||[],tl=me.tel;if(rs.length)enc({rs:rs,tel:tl}).then(function(e){return send(C,{t:'x',ek:e.ek,iv:e.iv,ct:e.ct})}).catch(function(){});me={};foto='';$('nome').value='';$('tel').value='';$('fp1').style.display=$('fp2').style.display='none';render()};
$('b2').onclick=function(){
  var m=$('mus').value.trim();if(!m)return alert('Escreva a música que quer cantar.');
  var id=rnd(12),r='r'+rnd(18),ch=Promise.resolve(),b=this,ref='';me.rs=(me.rs||[]).concat([r]);b.disabled=true;
  if(foto){var f=foto;ch=enc({tel:me.tel,foto:f}).then(function(e){var n=Math.ceil(e.ct.length/2500),ps=[],i;for(i=0;i<n;i++)ps.push(send(C,{t:'f',id:id,ek:e.ek,iv:e.iv,n:n,i:i,d:e.ct.slice(i*2500,(i+1)*2500)}));return Promise.all(ps)}).then(function(){foto=''})}
  ch.then(function(){return enc({nome:me.nome,tel:me.tel,musica:m,r:r})}).then(function(e){return send(C,{t:'p',id:id,ek:e.ek,iv:e.iv,ct:e.ct})}).then(function(j){ref=j&&j.id?String(j.id).slice(0,6):'';
    $('mus').value='';setA({id:id,r:r,st:'wait',nome:me.nome});aviso('');sub();render();b.disabled=false;$('dbg').textContent='Entregue ao servidor às '+new Date().toLocaleTimeString('pt-PT')+(ref?' · ref. '+ref:'')
  }).catch(function(e){b.disabled=false;alert('Não foi possível enviar o pedido ('+((e&&e.message)||'sem ligação')+'). Verifique a internet e tente de novo.')});
};
$('b4').onclick=function(){
  var a=getA();if(!a)return;
  enc({r:a.r,nome:a.nome}).then(function(e){return send(C,{t:'a',id:a.id,ek:e.ek,iv:e.iv,ct:e.ct})}).then(function(){if(es)es.stop=true;setA(null);aviso('Pedido anulado. Pode fazer outro.');render()}).catch(function(){alert('Não foi possível anular. Tente de novo.')});
};
if(!C||!K)show('s0');else{if(getA())sub();render()}
})();
</script></body></html>
